<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Frozen Player — Playlist + Search</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="player-wrapper">
    <div class="player-left">
      <div class="now-playing">
        <img id="now-cover" src="" alt="cover" />
        <div class="now-meta">
          <div id="now-title">—</div>
          <div id="now-artist">—</div>
        </div>
      </div>

      <div class="controls">
        <button id="prev">⏮</button>
        <button id="play">▶️</button>
        <button id="next">⏭</button>
      </div>

      <input id="search" placeholder="Поиск по трекам или артистам..." />
      <ul id="playlist"></ul>
    </div>

    <div class="player-right">
      <h3>Demo Playlist</h3>
      <p>Треки можно заменить на загрузку из API (см. player.js — section: API mode).</p>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="player.js"></script>
</body>
</html>
